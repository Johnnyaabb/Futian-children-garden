function getAreaCat(a){return AREA_CATS.find(c=>a>=c.min&&a<c.max)||AREA_CATS[AREA_CATS.length-1]}
function haversineKm(a,b){
  const R=6371,toR=x=>x*Math.PI/180,dl=toR(b.lat-a.lat),dn=toR(b.lng-a.lng);
  const s=Math.sin(dl/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dn/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function createIcon(park,hl=false,sel=false){
  const sz=sel?44:hl?40:26;
  const sc=STREET_COLORS[park.street]||"#4CAF50";

  const cat=getAreaCat(park.area);
  const dot=sz>22?`<div style="position:absolute;bottom:-1px;right:-1px;width:7px;height:7px;border-radius:50%;background:${cat.color};border:1.5px solid white;"></div>`:"";
  return L.divIcon({className:"",

    iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2-4]});
}
function popupHtml(p){

}

/* NLP */
function parseQuery(q){
  for(const s of STREETS){if(q.includes(s))return{type:"street",street:s};}
  for(const p of PARKS_RAW){
    const sn=p.name.replace(/公园|乐园|场地|儿童/g,"");
    if(sn.length>2&&(q.includes(p.name)||q.includes(sn)))return{type:"navigate",park:p};
  }
  if(["附近","最近"].some(t=>q.includes(t)))return{type:"nearest"};
  if(["大型","超大","最大"].some(t=>q.includes(t)))return{type:"top"};
  if(["微型","小型"].some(t=>q.includes(t)))return{type:"area_small"};
  if(["数量","几个","多少"].some(t=>q.includes(t)))return{type:"count"};
  return{type:"unknown"};
}
function buildRoute(from,to){
  const dl=to.lat-from.lat,dn=to.lng-from.lng,r=()=>(Math.random()-.5)*.003;
  return[from,{lat:from.lat+dl*.32+r(),lng:from.lng+dn*.32+r()},{lat:from.lat+dl*.67+r(),lng:from.lng+dn*.67+r()},to];
}

  /* divide-and-conquer union for O(n log n) performance */
  function massUnion(bufs){
    if(bufs.length===0)return null;
    if(bufs.length===1)return bufs[0];
    const mid=Math.floor(bufs.length/2);
    const L2=massUnion(bufs.slice(0,mid));
    const R2=massUnion(bufs.slice(mid));
    if(!L2)return R2;if(!R2)return L2;

        </div>
        {/* imported POI count badge */}
        {importedPOIs.length>0&&(
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,padding:"5px 8px",background:"#F3E8FF",borderRadius:8,border:"1px solid #D8B4FE"}}>
            <span style={{fontSize:13}}>✦</span>
            <span style={{fontSize:10,color:"#6D28D9",fontWeight:600}}>{t.importedPOI(importedPOIs.length)}</span>
            <button onClick={()=>setImportedPOIs([])} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:"#a78bfa",fontSize:12}}>✕</button>
          </div>
        )}
        {/* list body */}
        {!listCollapsed&&(
          <>
            {listParks.slice(0,12).map(park=>{
              const sc=STREET_COLORS[park.street]||"#888",cat=getAreaCat(park.area),isSel=selectedPark?.id===park.id;
              return(
                <div key={park.id} onClick={()=>{setSelectedPark(park);mapRef.current?.flyTo([park.lat,park.lng],16,{duration:.9});setTimeout(()=>markersRef.current[park.id]?.openPopup(),950);}}
                  style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:8,marginBottom:3,cursor:"pointer",background:isSel?"#FFF3E0":"transparent",border:`1px solid ${isSel?"#FF7043":"transparent"}`,transition:"all .12s"}}>
                  <div style={{width:9,height:9,borderRadius:"50%",background:sc,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:600,color:"#1a1a1a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{park.name}</div>
                    <div style={{fontSize:9,color:"#aaa"}}>{park.street} · <span style={{color:cat.color}}>{cat.label} {park.area}㎡</span></div>
                  </div>
                  {isSel&&<span style={{fontSize:11}}>📍</span>}
                </div>
              );
            })}
            {listSearch&&listParks.length===0&&<div style={{fontSize:11,color:"#aaa",textAlign:"center",padding:"12px 0"}}>{t.noResults}</div>}
            {listParks.length>12&&<div style={{fontSize:10,color:"#aaa",textAlign:"center",padding:"4px"}}>{t.moreParks(listParks.length-12)}</div>}
          </>
        )}
      </div>


      {/* === 城市服务设施模块 === */}
      <div style={{padding:"10px 16px 6px"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:poiModuleOpen?10:0,cursor:"pointer"}} onClick={()=>setPoiModuleOpen(v=>!v)}>
          <span style={{fontSize:13}}>🏙</span>
          <span style={{fontSize:12,fontWeight:700,color:"#111",flex:1}}>城市服务设施</span>
          <span style={{fontSize:10,color:"#aaa"}}>City Services</span>
          <span style={{fontSize:11,color:"#bbb",marginLeft:4}}>{poiModuleOpen?"▲":"▼"}</span>
        </div>
        {poiModuleOpen&&(()=>{
          // 当前街道key（去掉"街道"后缀）
          const streetKey = filterStreet ? filterStreet.replace(/街道$|保税区$/, '') : null;
          const streetDisplay = filterStreet || "全福田区";
          const counts = POI_CATS.map(cat => {
            const d = POI_ANALYSIS_DATA[cat.key];
            if (!streetKey) return {cat, val: Object.values(d).reduce((a,b)=>a+b,0)};
            // match partial key
            const matchKey = Object.keys(d).find(k => streetKey.includes(k) || k.includes(streetKey));
            return {cat, val: matchKey ? d[matchKey] : 0};
          });
          const total = counts.reduce((s,c)=>s+c.val,0);

          // SVG pie chart
          const PIE_R = 48, PIE_CX = 60, PIE_CY = 60;
          let cumAngle = -Math.PI/2;
          const slices = counts.map(({cat,val})=>{
            const frac = total>0 ? val/total : 0;
            const a0 = cumAngle;
            const a1 = cumAngle + frac * Math.PI * 2;
            cumAngle = a1;
            const x0=PIE_CX+PIE_R*Math.cos(a0), y0=PIE_CY+PIE_R*Math.sin(a0);
            const x1=PIE_CX+PIE_R*Math.cos(a1), y1=PIE_CY+PIE_R*Math.sin(a1);
            const large = frac>0.5?1:0;
            const d = frac===0 ? "" : frac===1
              ? `M${PIE_CX},${PIE_CY-PIE_R} A${PIE_R},${PIE_R},0,1,1,${PIE_CX-0.001},${PIE_CY-PIE_R} Z`
              : `M${PIE_CX},${PIE_CY} L${x0.toFixed(2)},${y0.toFixed(2)} A${PIE_R},${PIE_R},0,${large},1,${x1.toFixed(2)},${y1.toFixed(2)} Z`;
            return {cat, val, frac, d};
          });

          return (
            <div>
              {/* 搜索框 */}
              <div style={{marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",background:"#f5f5f7",borderRadius:8,padding:"5px 10px",gap:6,border:"1.5px solid",borderColor:poiSearch?"#9C27B0":"transparent",transition:"border-color .2s"}}>
                  <span style={{fontSize:13}}>🔍</span>
                  <input
                    value={poiSearch}
                    onChange={e=>handlePoiSearch(e.target.value)}
                    placeholder="搜索POI数据库，如：咖啡、地铁、银行…"
                    style={{flex:1,border:"none",background:"transparent",outline:"none",fontSize:11,color:"#333"}}
                  />
                  {poiSearching&&<span style={{fontSize:10,color:"#9C27B0"}}>⏳</span>}
                  {poiSearch&&!poiSearching&&<span onClick={()=>{setPoiSearch("");setPoiSearchResults([]);}} style={{cursor:"pointer",color:"#bbb",fontSize:13,lineHeight:1}}>✕</span>}
                </div>
                {poiSearchResults.length>0&&(
                  <div style={{marginTop:5,display:"flex",alignItems:"center",gap:6}}>
                    <div style={{fontSize:10,color:"#9C27B0",fontWeight:600,padding:"3px 6px",background:"#F3E8FF",borderRadius:6}}>
                      🔍 找到 {poiSearchResults.length} 个结果，已标注在地图上
                    </div>
                    <button onClick={()=>{
                      const rows=poiSearchResults.map(r=>({
                        "名称":r.name,"地址":r.addr,"小类":r.type,"大类":r.cat,
                        "纬度(WGS84)":r.lat,"经度(WGS84)":r.lng
                      }));
                      const ws=XLSX.utils.json_to_sheet(rows);
                      ws["!cols"]=[{wch:28},{wch:36},{wch:14},{wch:14},{wch:14},{wch:14}];
                      const wb=XLSX.utils.book_new();
                      XLSX.utils.book_append_sheet(wb,ws,"POI检索结果");
                      XLSX.writeFile(wb,`POI_${poiSearch}_${poiSearchResults.length}条.xlsx`);
                    }} style={{display:"flex",alignItems:"center",gap:3,padding:"3px 8px",borderRadius:6,border:"1.5px solid #9C27B0",background:"#fff",cursor:"pointer",fontSize:10,color:"#9C27B0",fontWeight:600,whiteSpace:"nowrap"}}>
                      ⬇ 导出Excel
                    </button>
                  </div>
                )}
              </div>
              {/* 类别开关 */}
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                {POI_CATS.map((cat,i)=>{
                  const on=activePOICats.includes(i);
                  return <button key={cat.key} onClick={()=>{setShowPOILayer(true);setActivePOICats(prev=>on&&prev.length>1?prev.filter(x=>x!==i):[...new Set([...prev,i])]);}} style={{display:"flex",alignItems:"center",gap:2,padding:"3px 6px",borderRadius:6,border:`1.5px solid ${on?cat.color:"#ddd"}`,background:on?cat.color+"18":"#fafafa",cursor:"pointer",fontSize:9,color:on?cat.color:"#aaa",fontWeight:on?600:400,transition:"all .15s",lineHeight:1.3}}>
                    <span>{cat.icon}</span><span>{cat.key}</span>
                  </button>;
                })}
                <button onClick={()=>{setShowPOILayer(v=>!v);}} style={{padding:"3px 7px",borderRadius:6,border:`1.5px solid ${showPOILayer?"#2196F3":"#ddd"}`,background:showPOILayer?"#e3f2fd":"#fafafa",cursor:"pointer",fontSize:10,color:showPOILayer?"#2196F3":"#aaa",fontWeight:showPOILayer?600:400}}>
                  {showPOILayer?"隐藏地图":"显示地图"}
                </button>
              </div>
              {/* street label */}
              <div style={{fontSize:10,color:"#888",marginBottom:8,background:"#f5f5f5",borderRadius:6,padding:"4px 8px",display:"inline-flex",alignItems:"center",gap:4}}>
                <span>📍</span><span style={{fontWeight:600,color:"#333"}}>{streetDisplay}</span>
                <span>· 共 {total} 个POI</span>
              </div>
              {/* layout: pie left, legend right */}
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                {/* pie */}
                <svg width="120" height="120" style={{flexShrink:0}}>
                  {total===0
                    ? <circle cx={PIE_CX} cy={PIE_CY} r={PIE_R} fill="#eee"/>
                    : slices.map(({cat,d})=>(
                        <path key={cat.key} d={d} fill={cat.color} stroke="#fff" strokeWidth="1.5"/>
                      ))
                  }
                  <circle cx={PIE_CX} cy={PIE_CY} r={22} fill="#fff"/>
                  <text x={PIE_CX} y={PIE_CY+4} textAnchor="middle" fontSize="11" fontWeight="700" fill="#333">{total}</text>
                </svg>
                {/* legend */}
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
                  {counts.map(({cat,val})=>{
                    const pct = total>0 ? Math.round(val/total*100) : 0;
                    return (
                      <div key={cat.key}>
                        <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
                          <span style={{fontSize:13}}>{cat.icon}</span>
                          <span style={{fontSize:10,color:"#333",flex:1,lineHeight:1.2}}>{cat.key}</span>
                          <span style={{fontSize:11,fontWeight:700,color:cat.color}}>{val}</span>
                        </div>
                        <div style={{height:4,background:"#f0f0f0",borderRadius:2,overflow:"hidden"}}>
                          <div style={{width:`${pct}%`,height:"100%",background:cat.color,borderRadius:2,transition:"width .4s ease"}}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })()}
      </div>

      <div style={{height:20}}/>
    </div>
  </div>
  <style>{`@keyframes dt{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}`}</style>
</div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
