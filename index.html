function getAreaCat(a){return AREA_CATS.find(c=>a>=c.min&&a<c.max)||AREA_CATS[AREA_CATS.length-1]}
function haversineKm(a,b){
  const R=6371,toR=x=>x*Math.PI/180,dl=toR(b.lat-a.lat),dn=toR(b.lng-a.lng);
  const s=Math.sin(dl/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dn/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

  const sz=sel?44:hl?40:26;
  const sc=STREET_COLORS[park.street]||"#4CAF50";

/* NLP */
function parseQuery(q){
  for(const s of STREETS){if(q.includes(s))return{type:"street",street:s};}
  for(const p of PARKS_RAW){
    const sn=p.name.replace(/公园|乐园|场地|儿童/g,"");
    if(sn.length>2&&(q.includes(p.name)||q.includes(sn)))return{type:"navigate",park:p};
  }
  if(["附近","最近"].some(t=>q.includes(t)))return{type:"nearest"};
  if(["大型","超大","最大"].some(t=>q.includes(t)))return{type:"top"};
  if(["微型","小型"].some(t=>q.includes(t)))return{type:"area_small"};
  if(["数量","几个","多少"].some(t=>q.includes(t)))return{type:"count"};
  return{type:"unknown"};
}
function buildRoute(from,to){
  const dl=to.lat-from.lat,dn=to.lng-from.lng,r=()=>(Math.random()-.5)*.003;

}

  /* divide-and-conquer union for O(n log n) performance */
  function massUnion(bufs){
    if(bufs.length===0)return null;
    if(bufs.length===1)return bufs[0];
    const mid=Math.floor(bufs.length/2);
    const L2=massUnion(bufs.slice(0,mid));
    const R2=massUnion(bufs.slice(mid));
    if(!L2)return R2;if(!R2)return L2;
    try{return turf.union(L2,R2)||L2;}catch(e){return L2;}
  }

                      XLSX.utils.book_append_sheet(wb,ws,"POI检索结果");

                    </button>
                  </div>
                )}
              </div>
              {/* 类别开关 */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:8}}>
                {POI_CATS.map((cat,i)=>{
                  const on=activePOICats.includes(i);
                  return <button key={cat.key} onClick={()=>{setShowPOILayer(true);setActivePOICats(prev=>on&&prev.length>1?prev.filter(x=>x!==i):[...new Set([...prev,i])]);}} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"5px 6px",borderRadius:6,border:`1.5px solid ${on?cat.color:"#ddd"}`,background:on?cat.color+"18":"#fafafa",cursor:"pointer",fontSize:10,color:on?cat.color:"#aaa",fontWeight:on?600:400,transition:"all .15s",lineHeight:1.3,width:"100%"}}>
                    <span>{cat.icon}</span><span>{cat.key}</span>
                  </button>;
                })}

                    ? <circle cx={PIE_CX} cy={PIE_CY} r={PIE_R} fill="#eee"/>
                    : slices.map(({cat,d})=>(
                        <path key={cat.key} d={d} fill={cat.color} stroke="#fff" strokeWidth="1.5"/>
                      ))
                  }
                  <circle cx={PIE_CX} cy={PIE_CY} r={22} fill="#fff"/>
                  <text x={PIE_CX} y={PIE_CY+4} textAnchor="middle" fontSize="11" fontWeight="700" fill="#333">{total}</text>
                </svg>
                {/* legend */}
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
                  {counts.map(({cat,val})=>{
                    const pct = total>0 ? Math.round(val/total*100) : 0;
                    return (
                      <div key={cat.key}>
                        <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
                          <span style={{fontSize:13}}>{cat.icon}</span>
                          <span style={{fontSize:10,color:"#333",flex:1,lineHeight:1.2}}>{cat.key}</span>
                          <span style={{fontSize:11,fontWeight:700,color:cat.color}}>{val}</span>
                        </div>
                        <div style={{height:4,background:"#f0f0f0",borderRadius:2,overflow:"hidden"}}>
                          <div style={{width:`${pct}%`,height:"100%",background:cat.color,borderRadius:2,transition:"width .4s ease"}}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })()}
      </div>

      <div style={{height:20}}/>
    </div>
  </div>
  <style>{`@keyframes dt{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}`}</style>
</div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
