  const cat=getAreaCat(park.area);
  const dot=sz>22?`<div style="position:absolute;bottom:-1px;right:-1px;width:7px;height:7px;border-radius:50%;background:${cat.color};border:1.5px solid white;"></div>`:"";
  return L.divIcon({className:"",
    html:`<div style="position:relative;width:${sz}px;height:${sz}px;background:${bg};border-radius:50%;border:2.5px solid white;box-shadow:${ring};display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.38)}px;cursor:pointer;">${sz>28?"🌳":"·"}${dot}</div>`,
    iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2-4]});
}
function popupHtml(p){
  const sc=STREET_COLORS[p.street]||"#4CAF50",cat=getAreaCat(p.area);
  return `<div style="padding:13px 15px;min-width:200px;font-family:system-ui,'PingFang SC',sans-serif;">
    <div style="font-size:14px;font-weight:700;color:#111;margin-bottom:5px;">${p.name}</div>
    <div style="display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap;">
      <span style="font-size:11px;background:${sc}22;color:${sc};border-radius:4px;padding:2px 7px;font-weight:600;">${p.street}</span>
      <span style="font-size:11px;background:${cat.color}22;color:${cat.color};border-radius:4px;padding:2px 7px;font-weight:600;">${cat.label} ${p.area}㎡</span>
    </div>
    <div style="font-size:11px;color:#666;line-height:1.5;margin-bottom:5px;">${p.address}</div>
    <div style="font-size:10px;color:#aaa;">类型：${p.type}</div></div>`;
}

/* NLP */
function parseQuery(q){
  for(const s of STREETS){if(q.includes(s))return{type:"street",street:s};}
  for(const p of PARKS_RAW){
    const sn=p.name.replace(/公园|乐园|场地|儿童/g,"");
    if(sn.length>2&&(q.includes(p.name)||q.includes(sn)))return{type:"navigate",park:p};
  }
  if(["附近","最近"].some(t=>q.includes(t)))return{type:"nearest"};
  if(["大型","超大","最大"].some(t=>q.includes(t)))return{type:"top"};
  if(["微型","小型"].some(t=>q.includes(t)))return{type:"area_small"};
  if(["数量","几个","多少"].some(t=>q.includes(t)))return{type:"count"};
  return{type:"unknown"};
}
function buildRoute(from,to){
  const dl=to.lat-from.lat,dn=to.lng-from.lng,r=()=>(Math.random()-.5)*.003;
  return[from,{lat:from.lat+dl*.32+r(),lng:from.lng+dn*.32+r()},{lat:from.lat+dl*.67+r(),lng:from.lng+dn*.67+r()},to];
}

/* ─── APP ─── */
function App(){
  const mapDivRef=useRef(null),mapRef=useRef(null);
  const markersRef=useRef({}),bufRef=useRef(null),routeRef=useRef(null),distRef=useRef(null);
  const debRef=useRef(null),chatEndRef=useRef(null),tileRef=useRef(null);

  const [transport,setTransport]=useState("walk");
  const [timeVal,setTimeVal]=useState(15);
  const [distVal,setDistVal]=useState(1500);
  const [useTime,setUseTime]=useState(true);
  const [coverMode,setCoverMode]=useState("single");
  const [coverArea,setCoverArea]=useState(null);
  const [selectedPark,setSelectedPark]=useState(null);
  const [filterStreet,setFilterStreet]=useState(null);
  const [filterArea,setFilterArea]=useState(null);
  const [showBounds,setShowBounds]=useState(true);
  const [msgs,setMsgs]=useState([{role:"agent",text:"👋 你好！我是 Space Agent。\n\n已加载福田区 160 个儿童友好空间。\n\n可以问：\n• 「园岭街道的公园」\n• 「面积最大的公园」\n• 「去[公园名称]」\n• 「附近公园」"}]);
  const [chatIn,setChatIn]=useState("");
  const [typing,setTyping]=useState(false);
  const [navInfo,setNavInfo]=useState(null);
  const [mapStyle,setMapStyle]=useState("osm");
  const [listCollapsed,setListCollapsed]=useState(false);
  const [listSearch,setListSearch]=useState("");
  const [importedPOIs,setImportedPOIs]=useState([]);
  const importLayerRef=useRef(null);
  const importInputRef=useRef(null);
  const streetBoundLayerRef=useRef(null);
  const [streetBoundArea,setStreetBoundArea]=useState(null);

  const visibleParks=useMemo(()=>{
    let ps=PARKS_RAW;
    if(filterStreet)ps=ps.filter(p=>p.street===filterStreet);
    if(filterArea){const c=AREA_CATS.find(c=>c.key===filterArea);if(c)ps=ps.filter(p=>p.area>=c.min&&p.area<c.max);}
    return ps;
  },[filterStreet,filterArea]);

  const listParks=useMemo(()=>{
    if(!listSearch.trim())return visibleParks;
    const q=listSearch.trim().toLowerCase();
    return visibleParks.filter(p=>p.name.toLowerCase().includes(q)||p.street.includes(q)||p.address.toLowerCase().includes(q));
  },[visibleParks,listSearch]);

  /* swap tile layer when style changes */
  useEffect(()=>{
    const map=mapRef.current;if(!map)return;
    const style=MAP_STYLES.find(s=>s.key===mapStyle)||MAP_STYLES[0];
    if(tileRef.current)map.removeLayer(tileRef.current);
    tileRef.current=L.tileLayer(style.url,{attribution:style.attr,maxZoom:style.maxZoom||19,subdomains:style.subdomains||"abc"}).addTo(map);
    tileRef.current.bringToBack();
  },[mapStyle]);

  /* init map */
  useEffect(()=>{
    const map=L.map(mapDivRef.current,{center:[22.536,114.048],zoom:13,zoomControl:false});
    tileRef.current=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(map);
    L.control.zoom({position:"bottomright"}).addTo(map);
    bufRef.current=L.layerGroup().addTo(map);
    routeRef.current=L.layerGroup().addTo(map);
    distRef.current=L.layerGroup().addTo(map);
    importLayerRef.current=L.layerGroup().addTo(map);
    streetBoundLayerRef.current=L.layerGroup().addTo(map);
    PARKS_RAW.forEach(park=>{
      const m=L.marker([park.lat,park.lng],{icon:createIcon(park)}).bindPopup(popupHtml(park),{maxWidth:260}).addTo(map);
      m.on("click",()=>setSelectedPark(park));
      markersRef.current[park.id]=m;
    });
    mapRef.current=map;
    return()=>{map.remove();mapRef.current=null;};
  },[]);

  /* render imported POIs */
  useEffect(()=>{
    const layer=importLayerRef.current;if(!layer)return;
    layer.clearLayers();
    importedPOIs.forEach(p=>{
      const icon=L.divIcon({className:"",html:`<div style="width:22px;height:22px;border-radius:50%;background:#7C3AED;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700">✦</div>`,iconSize:[22,22],iconAnchor:[11,11]});
      L.marker([p.lat,p.lng],{icon}).bindPopup(`<b>${p.name||"导入点"}</b>${p.note?`<br><span style="font-size:11px;color:#666">${p.note}</span>`:""}<br><span style="font-size:10px;color:#aaa">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span>`,{maxWidth:220}).addTo(layer);
    });
  },[importedPOIs]);

  /* render street boundary when filterStreet changes */
  useEffect(()=>{
    const layer=streetBoundLayerRef.current;if(!layer)return;
    layer.clearLayers();setStreetBoundArea(null);
    if(!filterStreet||typeof STREET_GEOJSON==="undefined")return;
    const feat=STREET_GEOJSON.features.find(f=>f.properties.name===filterStreet);
    if(!feat)return;
    const color=STREET_COLORS[filterStreet]||"#1565C0";
    L.geoJSON(feat,{style:{color,weight:3,opacity:.95,fillColor:color,fillOpacity:.07,dashArray:null}}).addTo(layer);
    const areaSqm=turf.area(feat);
    setStreetBoundArea(areaSqm);
    const bounds=L.geoJSON(feat).getBounds();
    mapRef.current?.fitBounds(bounds,{padding:[30,30]});
  },[filterStreet]);

  function handleImport(e){
    const file=e.target.files[0];if(!file)return;
    e.target.value="";
    const reader=new FileReader();
    reader.onload=ev=>{
      const text=ev.target.result.trim();
      let rows=[];
      try{
        // Try JSON first
        const data=JSON.parse(text);
        const arr=Array.isArray(data)?data:(data.features?data.features.map(f=>({name:f.properties?.name||"",lat:f.geometry?.coordinates[1],lng:f.geometry?.coordinates[0],note:f.properties?.note||""})):null);
        if(!arr)throw new Error("unknown json");
        rows=arr.filter(r=>r.lat!=null&&r.lng!=null&&!isNaN(r.lat)&&!isNaN(r.lng)).map(r=>({name:String(r.name||r.title||r.id||"导入点"),lat:parseFloat(r.lat||r.latitude),lng:parseFloat(r.lng||r.lon||r.longitude),note:r.note||r.description||r.address||""}));
      }catch{
        // Parse CSV
        const lines=text.split(/\r?\n/).filter(l=>l.trim());
        const header=lines[0].split(",").map(h=>h.trim().toLowerCase());
        const li=h=>header.indexOf(h);
        const latI=li("lat")>-1?li("lat"):li("latitude")>-1?li("latitude"):li("纬度")>-1?li("纬度"):1;
        const lngI=li("lng")>-1?li("lng"):li("lon")>-1?li("lon"):li("longitude")>-1?li("longitude"):li("经度")>-1?li("经度"):2;
        const nameI=li("name")>-1?li("name"):li("名称")>-1?li("名称"):0;
        const noteI=li("note")>-1?li("note"):li("address")>-1?li("address"):li("地址")>-1?li("地址"):-1;
        const startRow=isNaN(parseFloat(lines[0].split(",")[latI]))?1:0;
        rows=lines.slice(startRow).map(l=>{const c=l.split(",");const lat=parseFloat(c[latI]),lng=parseFloat(c[lngI]);return{name:c[nameI]?.replace(/"/g,"")||"导入点",lat,lng,note:noteI>-1?(c[noteI]?.replace(/"/g,"")||""):""};}).filter(r=>!isNaN(r.lat)&&!isNaN(r.lng));
      }
      if(!rows.length){alert("未识别到有效坐标数据，支持 CSV（含lat/lng列）或 GeoJSON 格式");return;}
      setImportedPOIs(prev=>[...prev,...rows]);
      // Fly to first imported point
      if(mapRef.current&&rows[0])mapRef.current.flyTo([rows[0].lat,rows[0].lng],14,{duration:1});
    };
    reader.readAsText(file);
  }

  /* marker visibility + icons */
  useEffect(()=>{
    const visIds=new Set(visibleParks.map(p=>p.id));
    PARKS_RAW.forEach(p=>{
      const m=markersRef.current[p.id];if(!m||!mapRef.current)return;
      const vis=visIds.has(p.id),sel=selectedPark?.id===p.id;
      m.setIcon(createIcon(p,false,sel));
      if(vis&&!mapRef.current.hasLayer(m))m.addTo(mapRef.current);
      if(!vis&&mapRef.current.hasLayer(m))m.removeFrom(mapRef.current);
    });
  },[visibleParks,selectedPark]);

  /* district boundaries */
  useEffect(()=>{
    const dl=distRef.current;if(!dl)return;
    dl.clearLayers();
    if(!showBounds)return;
    const targets=filterStreet?[filterStreet]:STREETS;
    targets.forEach(street=>{
      const color=STREET_COLORS[street]||"#888";
      const ps=PARKS_RAW.filter(p=>p.street===street);
      if(ps.length<3)return;
      try{
        const pts=turf.featureCollection(ps.map(p=>turf.point([p.lng,p.lat])));
        const hull=turf.convexHull(pts);if(!hull)return;
        const buf=turf.buffer(hull,0.38,{units:"kilometers"});
        const active=!!filterStreet;
        L.geoJSON(buf,{style:{color,weight:active?2.5:1.5,opacity:active?.9:.5,fillColor:color,fillOpacity:active?.1:.04,dashArray:active?null:"5,4"}}).addTo(dl);
        if(active){
          const ctr=turf.centroid(buf);
          L.marker([ctr.geometry.coordinates[1],ctr.geometry.coordinates[0]],{
            icon:L.divIcon({className:"",html:`<div style="background:${color};color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;box-shadow:0 1px 6px rgba(0,0,0,.3);">${street}</div>`,iconAnchor:[30,10]})
          }).addTo(dl);
        }
      }catch(e){}
    });
  },[filterStreet,showBounds]);

  /* divide-and-conquer union for O(n log n) performance */
  function massUnion(bufs){
    if(bufs.length===0)return null;
    if(bufs.length===1)return bufs[0];
    const mid=Math.floor(bufs.length/2);
    const L2=massUnion(bufs.slice(0,mid));
    const R2=massUnion(bufs.slice(mid));
    if(!L2)return R2;if(!R2)return L2;
    try{return turf.union(L2,R2)||L2;}catch(e){return L2;}
  }

  /* buffer */
  useEffect(()=>{
    clearTimeout(debRef.current);
    debRef.current=setTimeout(()=>{
      const map=mapRef.current,buf=bufRef.current;if(!map||!buf)return;
      buf.clearLayers();
      const speed=TRANSPORT[transport].speed,color=TRANSPORT[transport].color;
      const radiusKm=useTime?(speed*timeVal/60):(distVal/1000);
      const src=coverMode==="single"?(selectedPark?[selectedPark]:[]):visibleParks;
      if(!src.length)return;
      // Use fewer steps when processing many parks to keep rendering fast
      const steps=src.length>60?12:src.length>20?20:40;
      try{
        const buffers=src.map(p=>turf.buffer(turf.point([p.lng,p.lat]),radiusKm,{units:"kilometers",steps}));
        let areaGeom=null;
        if(coverMode==="union"&&buffers.length>1){
          const u=massUnion(buffers);
          if(u){L.geoJSON(u,{style:{fillColor:color,fillOpacity:.32,color,weight:2.5,opacity:.9,dashArray:"6,4"}}).addTo(buf);areaGeom=u;}
        }else if(coverMode==="intersect"&&buffers.length>1){
          let inter=buffers[0];
          for(let i=1;i<buffers.length;i++){
            const r=turf.intersect(inter,buffers[i]);
            if(!r){inter=null;break;}
            inter=r;
          }
          if(inter){L.geoJSON(inter,{style:{fillColor:"#FF7043",fillOpacity:.32,color:"#FF7043",weight:2.5,opacity:.9}}).addTo(buf);areaGeom=inter;}
        }else{
          // single or all — render every park
          src.forEach((p,i)=>{
            const fc=coverMode==="single"?color:STREET_COLORS[p.street]||color;
            L.geoJSON(buffers[i],{style:{fillColor:fc,fillOpacity:coverMode==="single"?.22:.08,color:fc,weight:coverMode==="single"?1.8:1,opacity:coverMode==="single"?.7:.4}}).addTo(buf);
          });
          // for single/all: union all for area calc
          areaGeom=buffers.length===1?buffers[0]:massUnion(buffers);
        }
        if(areaGeom){
          const sqm=turf.area(areaGeom);
          setCoverArea(sqm);
        }else{
          setCoverArea(null);
        }
      }catch(e){console.warn(e);setCoverArea(null);}
    },400);
    return()=>clearTimeout(debRef.current);
  },[transport,timeVal,distVal,useTime,coverMode,selectedPark,visibleParks]);

  useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:"smooth"});},[msgs,typing]);

  const handleSend=()=>{
    const q=chatIn.trim();if(!q)return;
    setChatIn("");setMsgs(prev=>[...prev,{role:"user",text:q}]);setTyping(true);
    setTimeout(()=>{
      const result=parseQuery(q);let reply="";
      if(result.type==="street"){
        setFilterStreet(result.street);setFilterArea(null);
        const ps=PARKS_RAW.filter(p=>p.street===result.street);
        const byArea=[...ps].sort((a,b)=>b.area-a.area);
        reply=`已筛选「${result.street}」✅\n共 ${ps.length} 个儿童友好空间\n\n最大：${byArea[0]?.name}（${byArea[0]?.area}㎡）\n最小：${byArea[byArea.length-1]?.name}（${byArea[byArea.length-1]?.area}㎡）\n\n地图已高亮显示街道范围。`;
      }else if(result.type==="navigate"){
        const pk=result.park;
        const origin={lat:22.536,lng:114.048};
        const distKm=haversineKm(origin,pk);
        const route=buildRoute(origin,pk);
        routeRef.current?.clearLayers();
        L.polyline(route.map(p=>[p.lat,p.lng]),{color:"#FF7043",weight:4.5,opacity:.88,dashArray:"12,7",lineCap:"round"}).addTo(routeRef.current);
        L.circleMarker([origin.lat,origin.lng],{radius:9,fillColor:"#2196F3",color:"white",weight:2.5,fillOpacity:1}).bindPopup("📍 当前位置").addTo(routeRef.current);
        setSelectedPark(pk);
        mapRef.current?.flyTo([pk.lat,pk.lng],16,{duration:1.2});
        const wm=Math.max(1,Math.round(distKm/4*60));
        setNavInfo({park:pk.name,distM:Math.round(distKm*1000),walkMin:wm,bikeMin:Math.max(1,Math.round(distKm/12*60)),transMin:Math.max(1,Math.round(distKm/20*60)),
          steps:["从当前位置出发，沿绿道前行","途经社区小路，注意儿童安全",`到达「${pk.name}」入口（${pk.area}㎡）`]});
        reply=`🧭 已规划「${pk.name}」路线\n所在：${pk.street}\n面积：${pk.area}㎡\n\n🚶 步行 ${wm} 分钟\n🚲 骑行 ${Math.max(1,Math.round(distKm/12*60))} 分钟\n📏 直线 ${Math.round(distKm*1000)}m`;
      }else if(result.type==="nearest"){
        const o={lat:22.536,lng:114.048};
        const top3=[...PARKS_RAW].sort((a,b)=>haversineKm(o,a)-haversineKm(o,b)).slice(0,3);
        reply=`📍 距你最近的 3 个公园：\n${top3.map((p,i)=>`${i+1}. ${p.name}\n   ${p.street}，约${Math.round(haversineKm(o,p)*1000)}m`).join("\n")}`;
      }else if(result.type==="top"){
        const top=[...PARKS_RAW].sort((a,b)=>b.area-a.area).slice(0,5);
        reply=`📐 面积最大 TOP 5：\n${top.map((p,i)=>`${i+1}. ${p.name}\n   ${p.street}，${p.area}㎡`).join("\n")}`;
      }else if(result.type==="area_small"){
        const sm=PARKS_RAW.filter(p=>p.area<100);
        reply=`微型公园（<100㎡）共 ${sm.length} 个，遍布各街道，以社区口袋空间为主。`;
      }else if(result.type==="count"){
        const cnt={};PARKS_RAW.forEach(p=>{cnt[p.street]=(cnt[p.street]||0)+1;});
        reply=`福田区共 ${PARKS_RAW.length} 个儿童友好空间：\n${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`• ${s}：${n} 个`).join("\n")}`;
      }else{
        reply=`已收录福田区 ${PARKS_RAW.length} 个儿童友好空间，覆盖 ${STREETS.length} 个街道。\n\n可以问：\n• 「园岭街道」查看街道\n• 「去[公园名]」导航\n• 「面积最大的公园」\n• 「各街道有几个」`;
      }
      setTyping(false);setMsgs(prev=>[...prev,{role:"agent",text:reply}]);
    },600+Math.random()*300);
  };

  const radiusKm=useTime?(TRANSPORT[transport].speed*timeVal/60):(distVal/1000);
  const tColor=TRANSPORT[transport].color;
  const stats=useMemo(()=>{
    const areas=visibleParks.map(p=>p.area);
    return{count:visibleParks.length,totalArea:Math.round(areas.reduce((a,b)=>a+b,0))};
  },[visibleParks]);

  return(
<div style={{display:"flex",height:"100vh"}}>
  {/* MAP */}
  <div style={{flex:1,position:"relative"}}>
    <div ref={mapDivRef} style={{width:"100%",height:"100%"}}/>
    {/* Title */}
    <div style={{position:"absolute",top:14,left:14,zIndex:1000,background:"rgba(255,255,255,.94)",backdropFilter:"blur(14px)",borderRadius:14,padding:"10px 16px",boxShadow:"0 3px 16px rgba(0,0,0,.15)",display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,#2E7D32,#1565C0)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🌳</div>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:"#111"}}>福田儿童友好空间智能感知平台</div>
        <div style={{fontSize:10,color:"#888"}}>Futian Child-Friendly Space Intelligence · {PARKS_RAW.length} 个空间</div>
      </div>
    </div>
    {/* Top badge */}
    <div style={{position:"absolute",top:14,left:"50%",transform:"translateX(-50%)",zIndex:1000,background:"rgba(255,255,255,.93)",backdropFilter:"blur(14px)",borderRadius:20,padding:"6px 16px",boxShadow:"0 2px 12px rgba(0,0,0,.13)",display:"flex",alignItems:"center",gap:10,fontSize:12,whiteSpace:"nowrap"}}>
      <span style={{fontWeight:700,color:"#2E7D32"}}>🗺 {stats.count} 个</span>
      <span style={{color:"#ccc"}}>|</span>
      <span style={{color:"#555"}}>总 <strong style={{color:"#1565C0"}}>{stats.totalArea.toLocaleString()}㎡</strong></span>
      <span style={{color:"#ccc"}}>|</span>
      <span style={{color:tColor,fontWeight:600}}>{TRANSPORT[transport].icon} {radiusKm.toFixed(1)}km 覆盖</span>
      {filterStreet&&<><span style={{color:"#ccc"}}>|</span><span style={{background:STREET_COLORS[filterStreet],color:"white",borderRadius:10,padding:"1px 8px",fontSize:11}}>{filterStreet}</span></>}
    </div>
    {/* Map style switcher */}
    <div style={{position:"absolute",top:14,right:14,zIndex:1000,background:"rgba(255,255,255,.94)",backdropFilter:"blur(14px)",borderRadius:12,padding:"8px 10px",boxShadow:"0 3px 16px rgba(0,0,0,.15)",display:"flex",gap:5}}>
      {MAP_STYLES.map(s=>(
        <button key={s.key} onClick={()=>setMapStyle(s.key)} title={s.label} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"5px 7px",borderRadius:8,border:"none",cursor:"pointer",background:mapStyle===s.key?"#1B5E20":"transparent",color:mapStyle===s.key?"white":"#555",fontSize:10,fontWeight:mapStyle===s.key?700:400,transition:"all .15s",minWidth:34}}>
          <span style={{fontSize:18,lineHeight:1}}>{s.icon}</span>
          <span>{s.label}</span>

  <style>{`@keyframes dt{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}`}</style>
</div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
