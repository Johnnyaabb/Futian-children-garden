function getAreaCat(a){return AREA_CATS.find(c=>a>=c.min&&a<c.max)||AREA_CATS[AREA_CATS.length-1]}
function haversineKm(a,b){
  const R=6371,toR=x=>x*Math.PI/180,dl=toR(b.lat-a.lat),dn=toR(b.lng-a.lng);
  const s=Math.sin(dl/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dn/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

/* NLP */
function parseQuery(q){
  for(const s of STREETS){if(q.includes(s))return{type:"street",street:s};}
  for(const p of PARKS_RAW){
    const sn=p.name.replace(/公园|乐园|场地|儿童/g,"");
    if(sn.length>2&&(q.includes(p.name)||q.includes(sn)))return{type:"navigate",park:p};
  }
  if(["附近","最近"].some(t=>q.includes(t)))return{type:"nearest"};
  if(["大型","超大","最大"].some(t=>q.includes(t)))return{type:"top"};
  if(["微型","小型"].some(t=>q.includes(t)))return{type:"area_small"};
  if(["数量","几个","多少"].some(t=>q.includes(t)))return{type:"count"};
  return{type:"unknown"};
}
function buildRoute(from,to){
  const dl=to.lat-from.lat,dn=to.lng-from.lng,r=()=>(Math.random()-.5)*.003;
  return[from,{lat:from.lat+dl*.32+r(),lng:from.lng+dn*.32+r()},{lat:from.lat+dl*.67+r(),lng:from.lng+dn*.67+r()},to];
}

        const latI=li("lat")>-1?li("lat"):li("latitude")>-1?li("latitude"):li("纬度")>-1?li("纬度"):1;
        const lngI=li("lng")>-1?li("lng"):li("lon")>-1?li("lon"):li("longitude")>-1?li("longitude"):li("经度")>-1?li("经度"):2;

        const startRow=isNaN(parseFloat(lines[0].split(",")[latI]))?1:0;
        rows=lines.slice(startRow).map(l=>{const c=l.split(",");const lat=parseFloat(c[latI]),lng=parseFloat(c[lngI]);return{name:c[nameI]?.replace(/"/g,"")||"导入点",lat,lng,note:noteI>-1?(c[noteI]?.replace(/"/g,"")||""):""};}).filter(r=>!isNaN(r.lat)&&!isNaN(r.lng));
      }
      if(!rows.length){alert("未识别到有效坐标数据，支持 CSV（含lat/lng列）或 GeoJSON 格式");return;}

      // Fly to first imported point

  /* divide-and-conquer union for O(n log n) performance */
  function massUnion(bufs){
    if(bufs.length===0)return null;
    if(bufs.length===1)return bufs[0];
    const mid=Math.floor(bufs.length/2);
    const L2=massUnion(bufs.slice(0,mid));
    const R2=massUnion(bufs.slice(mid));
    if(!L2)return R2;if(!R2)return L2;
    try{return turf.union(L2,R2)||L2;}catch(e){return L2;}
  }

        {/* imported POI count badge */}
        {importedPOIs.length>0&&(
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,padding:"5px 8px",background:"#F3E8FF",borderRadius:8,border:"1px solid #D8B4FE"}}>
            <span style={{fontSize:13}}>✦</span>
            <span style={{fontSize:10,color:"#6D28D9",fontWeight:600}}>{t.importedPOI(importedPOIs.length)}</span>
            <button onClick={()=>setImportedPOIs([])} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:"#a78bfa",fontSize:12}}>✕</button>
          </div>
        )}
        {/* list body */}
        {!listCollapsed&&(
          <>
            {listParks.slice(0,12).map(park=>{
              const sc=STREET_COLORS[park.street]||"#888",cat=getAreaCat(park.area),isSel=selectedPark?.id===park.id;
              return(
                <div key={park.id} onClick={()=>{setSelectedPark(park);mapRef.current?.flyTo([park.lat,park.lng],16,{duration:.9});setTimeout(()=>markersRef.current[park.id]?.openPopup(),950);}}
                  style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:8,marginBottom:3,cursor:"pointer",background:isSel?"#FFF3E0":"transparent",border:`1px solid ${isSel?"#FF7043":"transparent"}`,transition:"all .12s"}}>
                  <div style={{width:9,height:9,borderRadius:"50%",background:sc,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:600,color:"#1a1a1a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{park.name}</div>
                    <div style={{fontSize:9,color:"#aaa"}}>{park.street} · <span style={{color:cat.color}}>{cat.label} {park.area}㎡</span></div>
                  </div>
                  {isSel&&<span style={{fontSize:11}}>📍</span>}
                </div>
              );
            })}
            {listSearch&&listParks.length===0&&<div style={{fontSize:11,color:"#aaa",textAlign:"center",padding:"12px 0"}}>{t.noResults}</div>}
            {listParks.length>12&&<div style={{fontSize:10,color:"#aaa",textAlign:"center",padding:"4px"}}>{t.moreParks(listParks.length-12)}</div>}
          </>
        )}
      </div>

      <div style={{height:20}}/>
    </div>
  </div>
  <style>{`@keyframes dt{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}`}</style>
</div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
